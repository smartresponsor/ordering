version: "3.9"
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.local
    container_name: order_app
    env_file: ../.env.local
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-order}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-order}
      POSTGRES_DB: ${POSTGRES_DB:-orderdb}
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: [ "5432:5432" ]
  rabbitmq:
    image: rabbitmq:3.13-management
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pass}
    ports: [ "5672:5672","15672:15672" ]
    healthcheck:
      test: [ "CMD","rabbitmq-diagnostics","ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    security_opt:
      - no-new-privileges:true
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD","redis-cli","ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports: [ "9000:9000","9001:9001" ]
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    security_opt:
      - no-new-privileges:true
    ports: [ "1025:1025","8025:8025" ]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: [ "CMD","wget","-qO-","http://localhost:8025/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
