services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'
      - '../src/Migrations/'
      - '../src/Resources/'
      - '../src/**/Tests/'
      - '../src/**/*Test.php'
      - '../src/**/Kernel.php'

  App\\Controller\\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  App\\Api\\Controller\\:
    resource: '../src/Api/Controller/'
    tags: ['controller.service_arguments']
