imports:
    - { resource: 'component/services.yaml' }
    - { resource: '../src/Resources/config/services.php' }
    - { resource: 'services.security.yaml' }
    - { resource: '../../Cruding/config/services.yaml' }
    - { resource: '../../Viewing/Resources/config/services.php' }
    - { resource: '../../Interfacing/config/services/interfacing.yaml' }
    - { resource: '../../Localizing/config/services.yaml' }
    - { resource: '../../Vendoring/config/component/services.yaml' }

parameters:
    cruding.resource_requirement: '[a-z][a-z0-9_-]*'
    cruding.resource_path_requirement: '[a-z][a-z0-9_-]*(?:/(?!(?:new|edit|delete|audit|visibility|attach|detach)$)[a-z0-9][a-z0-9_-]*)*'
    cruding.surface_token_requirement: 'card|table|gallery|compact|full|detail|list'
    cruding.operation_token_requirement: 'show|index|new|create|edit|update|delete|bulk|import|export|archive|restore|duplicate|assign|unassign|adjust|calculate|verify|reject|approve|pay|recalculate|start|overview|mutation'
    cruding.identity_slug_requirement: '[A-Za-z0-9][A-Za-z0-9_-]*'
    cruding.runtime_scope_env: 'APP_RUNTIME_SCOPE'
    cruding.runtime_entity_env: 'APP_RUNTIME_ENTITY'
    cruding.runtime_surface_token_env: 'APP_RUNTIME_SURFACE_TOKEN'
    cruding.runtime_reserved_env: 'APP_RUNTIME_RESERVED'
    cruding.runtime_lock_glob: 'config/kernel/runtime_scope.{env}.lock.php'
    cruding.runtime_require_lock: false
    cruding.runtime_require_composer_packages: false
    cruding.runtime_scope_package_map:
        cruding: 'cruding/crud'
        viewing: 'viewing/view'
        interfacing: 'interfacing/interface'
        administering: 'administering/administer'
        accessing: 'accessing/access'
    cruding.runtime_scope_tokens:
        - accessing
        - adjudicating
        - administering
        - analysing
        - applicating
        - attaching
        - billing
        - carting
        - cataloging
        - commercializing
        - commissioning
        - configuring
        - cruding
        - currencing
        - discovering
        - domaining
        - exchanging
        - faceting
        - facting
        - indexing
        - interfacing
        - localizing
        - locating
        - managing
        - merchandising
        - messaging
        - navigating
        - objecting
        - observabiliting
        - ordering
        - paging
        - paying
        - projecting
        - rolling
        - sdk
        - searching
        - shipping
        - subscripting
        - tagging
        - taxating
        - vendoring
        - viewing
    cruding.runtime_entity_tokens:
        - vendor
        - attachment
        - media
        - product
        - category
        - search
        - role
        - application
    cruding.runtime_surface_tokens:
        - show
        - card
        - table
        - gallery
        - compact
        - full
        - detail
        - list
    cruding.runtime_operation_tokens:
        - show
        - index
        - new
        - create
        - edit
        - update
        - delete
        - bulk
        - import
        - export
        - archive
        - restore
        - duplicate
        - assign
        - unassign
        - adjust
        - calculate
        - verify
        - reject
        - approve
        - pay
        - recalculate
        - start
        - overview
        - mutation
    cruding.runtime_resource_path_reserved_tokens: []
    cruding.runtime_reserved_tokens: []
    cruding.runtime_allowed_resource_tokens: []
    cruding.runtime_conflicting_entity_tokens: []
    cruding.app_env: 'dev'
    cruding.runtime_lock_path: null
    cruding.runtime_lock_found: false
    cruding.runtime_lock_scope_tokens: []
    cruding.runtime_lock_entity_tokens: []
    cruding.runtime_lock_surface_tokens: []
    cruding.runtime_lock_reserved_tokens: []
    cruding.runtime_effective_scope_raw: ''
    cruding.runtime_effective_entity_raw: ''
    cruding.runtime_effective_surface_token_raw: ''
    cruding.runtime_effective_reserved_raw: ''
    cruding.capability_map:
        identifiable:
            interfaces:
                - App\Cruding\Contract\Capability\CrudIdentifiableInterface
            methods_any: ['getId']
            properties_any: ['id']
        sluggable:
            interfaces:
                - App\Cruding\Contract\Capability\CrudSluggableInterface
            methods_any: ['getSlug']
            properties_any: ['slug']
    cruding.entity_class_alias_map:
        vendor: 'App\Vendoring\Entity\Vendor\VendorEntity'
        attachment: 'App\Attaching\Entity\Attachment\Attachment'
        message: 'App\Messaging\Entity\Message\MessageEntity'
        order: 'App\Ordering\Entity\Order\OrderEntity'
        payment: 'App\Paying\Entity\PaymentEntity'
        product: 'App\Ordering\Entity\Product\CommerceProductEntity'
        project: 'App\Ordering\Entity\Project\CommerceProjectEntity'
        category: 'App\Cataloging\Entity\Catalog\CatalogCategoryEntity'
    cruding.form_type_map: []
    viewing.enabled: true
    viewing.bot_actor_values: ['bot']
    viewing.actor_request_attribute: '_view_actor_type'
    viewing.controlled_route_attribute: '_view_controlled'
    viewing.response_guard_enabled: true
    viewing.debug_response_guard: false
    viewing.diagnostic_mode: 'safe'
    viewing.traffic_classifier_enabled: true
    viewing.bot_user_agent_patterns:
        - '/bot/i'
        - '/crawl/i'
        - '/spider/i'
        - '/slurp/i'
        - '/headless/i'
        - '/python-requests/i'
        - '/curl/i'
        - '/wget/i'
    viewing.excluded_path_patterns:
        - '#^/_wdt(?:/|$)#'
        - '#^/_profiler(?:/|$)#'
        - '#^/assets(?:/|$)#'
        - '#^/build(?:/|$)#'
        - '#^/favicon\\.ico$#'
        - '#^/robots\\.txt$#'
        - '#^/sitemap\\.xml$#'
        - '#^/health$#'
        - '#^/metrics$#'
    viewing.excluded_route_patterns:
        - '#^_profiler#'
        - '#^_wdt#'
        - '#^health$#'
        - '#^metrics$#'
    viewing.interfacing_twig_namespace: 'Interfacing'
    viewing.viewing_twig_namespace: 'Viewing'
    viewing.local_component_fallback_enabled: true
    viewing.json_fallback_status_code: 200

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Ordering\Controller\OrderManagementController:
        tags: [ 'controller.service_arguments' ]

    App\Ordering\Controller\OrderApiController:
        tags: [ 'controller.service_arguments' ]

    App\Ordering\Controller\Webhook\PaymentWebhookController:
        tags: [ 'controller.service_arguments' ]

    App\Ordering\Controller\Monitoring\:
        resource: '../src/Controller/Monitoring/'
        tags: [ 'controller.service_arguments' ]

    Psr\Container\ContainerInterface: '@service_container'

    App\Ordering\Form\:
        resource: '../src/Form/'

    App\Ordering\Service\:
        resource: '../src/Service/'
        exclude:
            - '../src/Service/Tx/'
            - '../src/Service/Http/'
            - '../src/Service/Transport/'
            - '../src/Service/Outbox/OutboxPublisher.php'
            - '../src/Service/Pricing/Order/FlatTaxStrategy.php'
            - '../src/Service/Pricing/Order/InMemoryRateProvider.php'
            - '../src/Service/Pricing/Order/ProgressiveTaxStrategy.php'
            - '../src/Service/Pricing/Order/TaxationConfigLoader.php'
            - '../src/Service/Pricing/Order/CurrencyConversionService.php'
            - '../src/Service/Security/Order/Kernel.php'
            - '../src/Service/Security/Order/OrderWebhookSignatureVerifier.php'
            - '../src/Service/Security/Order/OrderOpenApiFactory.php'
            - '../src/Service/Security/Order/*Command.php'
            - '../src/Service/Security/Order/*Message.php'
            - '../src/Service/Security/Order/*View.php'

    App\Ordering\Service\Config\OrderingRateLimitsConfigService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $applyService: '@App\Administering\Service\Config\AdministrationConfigApplyService'
            $fileWriter: '@App\Administering\Service\Config\AdministrationConfigFileWriterService'
        tags: [ 'administering.config_tool' ]

    App\Ordering\EventListener\:
        resource: '../src/EventListener/'
        exclude:
            - '../src/EventListener/Http/'

    App\Ordering\EventSubscriber\:
        resource: '../src/EventSubscriber/'

    App\Ordering\Subscriber\:
        resource: '../src/Subscriber/'

    App\Ordering\Validator\:
        resource: '../src/Validator/'

    App\Ordering\Processor\:
        resource: '../src/Processor/'

    App\Ordering\Repository\:
        resource: '../src/Repository/'

    App\Ordering\Repository\Order\OrderRepository:
        tags: [ 'doctrine.repository_service' ]

    App\Ordering\Webhook\:
        resource: '../src/Webhook/'

    App\Ordering\ReadModel\Service\:
        resource: '../src/ReadModel/Service/'

    App\Ordering\ReadModel\Repository\:
        resource: '../src/ReadModel/Repository/'

    App\Ordering\Infrastructure\Monitoring\MetricsCollector: ~

    App\Ordering\Service\Analytics\Order\BigQueryExportSink:
        arguments:
            $targetPath: '%kernel.project_dir%/var/bigquery'

    App\Ordering\ServiceInterface\Analytics\Order\ExportSinkInterface: '@App\Ordering\Service\Analytics\Order\BigQueryExportSink'
    App\Ordering\ServiceInterface\Analytics\Order\BigQueryExportSinkInterface: '@App\Ordering\Service\Analytics\Order\BigQueryExportSink'
    App\Ordering\Service\Analytics\Order\ClickHouseExportSink:
        arguments:
            $endpoint: 'http://127.0.0.1:8123'
            $table: 'order_metrics_aggregate_view'

    App\Ordering\ServiceInterface\Analytics\Order\ClickHouseExportSinkInterface: '@App\Ordering\Service\Analytics\Order\ClickHouseExportSink'
    App\Ordering\Service\SensitiveData\MaskingService:
        arguments:
            $maskKeys: ['email', 'phone', 'card_number', 'password', 'plainPassword']
        public: true
    App\Ordering\Service\Security\Order\CryptoService:
        arguments:
            $key: '%kernel.secret%'

    App\Ordering\ServiceInterface\Security\Order\CryptoServiceInterface: '@App\Ordering\Service\Security\Order\CryptoService'
    App\Ordering\Service\Security\Order\FileDlqRepository:
        arguments:
            $file: '%kernel.project_dir%/var/dlq.ndjson'

    App\Ordering\ServiceInterface\Security\Order\DlqRepositoryInterface: '@App\Ordering\Service\Security\Order\FileDlqRepository'
    App\Ordering\Service\Security\Order\FileJwkRepository:
        arguments:
            $dir: '%kernel.project_dir%/var/jwks'

    App\Ordering\ServiceInterface\Security\Order\JwkRepositoryInterface: '@App\Ordering\Service\Security\Order\FileJwkRepository'
    App\Ordering\ServiceInterface\Security\Order\IdempotencyStoreInterface: '@App\Ordering\Service\Security\Order\MemoryIdempotencyStore'
    App\Ordering\ServiceInterface\Webhook\Order\WebhookDispatcherInterface: '@App\Ordering\Webhook\NoopWebhookDispatcher'
    App\Ordering\ValueObject\Archival\Order\AuditLog:
        arguments:
            $file: '%kernel.project_dir%/var/dlq-audit.ndjson'

    App\Ordering\ServiceInterface\Security\Order\DlqConsoleInterface: '@App\Ordering\Service\Security\Order\DlqConsole'

    App\Ordering\Command\OrderDemoLoadCommand: ~
    App\Ordering\Command\OrderDemoResetCommand: ~
    App\Ordering\Command\OrderDiagnosticsCommand: ~
    App\Ordering\Command\OrderReportCommand: ~

    App\Ordering\Command\Outbox\:
        resource: '../src/Command/Outbox/'

    App\Ordering\Command\Messenger\:
        resource: '../src/Command/Messenger/'

    App\Ordering\Command\Operations\Order\:
        resource: '../src/Command/Operations/Order/'

    App\Ordering\DataFixtures\OrderDemoFixtures: ~

    Symfony\Component\Messenger\Transport\TransportInterface: '@messenger.transport.async'
    Symfony\Component\Messenger\Transport\Sender\SenderInterface: '@messenger.transport.async'
    Symfony\Component\Messenger\Transport\Receiver\ReceiverInterface: '@messenger.transport.failed'
    Symfony\Component\Workflow\WorkflowInterface: '@state_machine.order'
    Symfony\Component\RateLimiter\RateLimiterFactory: '@limiter.order_api_write'
    App\Ordering\RateLimiter\TenantKeyResolver: ~
    App\Ordering\Saga\OrderSaga: '@App\Ordering\Service\Workflow\Order\OrderSaga'
    App\Ordering\Contract\Gateway\Order\OrderPaymentGatewayInterface: '@App\Ordering\Service\Payment\Order\StripeGateway'
    App\Ordering\Contract\Gateway\Order\OrderShipmentGatewayInterface: '@App\Ordering\Service\Shipment\Order\DHLGateway'
    App\Ordering\Contract\Gateway\Order\OrderTaxationGatewayInterface: '@App\Ordering\Service\Pricing\Order\EUTaxStrategy'
    App\Ordering\ServiceInterface\Order\OrderCreationServiceInterface: '@App\Ordering\Service\Order\OrderCreationService'
    App\Ordering\ServiceInterface\Pricing\Order\PriceCalculatorInterface: '@App\Ordering\Service\Pricing\Order\PriceCalculator'
    App\Ordering\ServiceInterface\Pricing\Order\OrderPricingInterface: '@App\Ordering\Service\Pricing\Order\OrderPricingService'
    App\Ordering\ServiceInterface\Pricing\Order\DefaultPromotionStrategyInterface: '@App\Ordering\Service\Pricing\Order\DefaultPromotionStrategy'
    App\Ordering\ServiceInterface\Pricing\Order\TaxationStrategyInterface: '@App\Ordering\Service\Pricing\Order\VatExclusiveStrategy'
    App\Ordering\ServiceInterface\Pricing\Order\TaxationConfigLoaderInterface: '@App\Ordering\Service\Pricing\Order\TaxationConfigLoader'
    App\Ordering\ServiceInterface\Pricing\Order\CurrencyConversionServiceInterface: '@App\Ordering\Service\Pricing\Order\CurrencyConversionService'

    App\Ordering\RepositoryInterface\Order\OrderPaymentTransactionRepositoryInterface: '@App\Ordering\Repository\Order\OrderPaymentTransactionRepository'
    App\Ordering\RepositoryInterface\Order\OrderRefundTransactionRepositoryInterface: '@App\Ordering\Repository\Order\OrderRefundTransactionRepository'
    App\Ordering\RepositoryInterface\Order\OrderEventRepositoryInterface: '@App\Ordering\Repository\Order\OrderEventRepository'
    App\Ordering\RepositoryInterface\Order\OutboxRepositoryInterface: '@App\Ordering\Repository\Order\OutboxRepository'
    App\Ordering\RepositoryInterface\Order\OrderStockReservationRepositoryInterface: '@App\Ordering\Repository\Order\OrderStockReservationRepository'
    App\Ordering\RepositoryInterface\Order\OrderShipmentViewRepositoryInterface: '@App\Ordering\Repository\Order\OrderShipmentViewRepository'

    App\Ordering\ServiceInterface\Outbox\Order\OutboxRelayInterface: '@App\Ordering\Service\Outbox\Order\OutboxRelay'
    App\Ordering\ServiceInterface\Outbox\Order\DlqServiceInterface: '@App\Ordering\Service\Outbox\Order\DlqService'
    App\Ordering\ServiceInterface\Messaging\Order\TransactionalEventPublisherInterface: '@App\Ordering\Service\Messaging\Order\TransactionalEventPublisher'
    App\Ordering\ServiceInterface\Shipment\Order\OrderShipmentProjectionServiceInterface: '@App\Ordering\Service\Shipment\Order\OrderShipmentProjectionService'
    App\Ordering\Service\Shipment\Order\CarrierPollingService:
        arguments:
            $carriers: !tagged_iterator order.shipment.carrier

    App\Ordering\ServiceInterface\Shipment\Order\CarrierPollingServiceInterface: '@App\Ordering\Service\Shipment\Order\CarrierPollingService'
    App\Ordering\ServiceInterface\Refund\Order\RefundEligibilityServiceInterface: '@App\Ordering\Service\Refund\Order\RefundEligibilityService'
    App\Ordering\ServiceInterface\Refund\Order\OrderRefundEligibilityServiceInterface: '@App\Ordering\Service\Refund\Order\RefundEligibilityService'
    App\Ordering\ServiceInterface\Refund\Order\OrderServiceHookInterface: '@App\Ordering\Service\Refund\Order\OrderServiceHook'
    App\Ordering\ReadModel\ServiceInterface\Order\OrderReadModelUpdaterInterface: '@App\Ordering\ReadModel\Service\OrderReadModelUpdater'
    App\Ordering\ServiceInterface\Archival\Order\OrderAuditTrailBuilderInterface: '@App\Ordering\Service\Archival\Order\OrderAuditTrailBuilder'
    App\Ordering\ServiceInterface\Security\Order\OrderIdempotencyGuardInterface: '@App\Ordering\Service\Security\Order\IdempotencyGuard'
    App\Ordering\Service\Workflow\Order\OrderOrchestrator:
        public: true
    Doctrine\ORM\EntityManagerInterface:
        public: true
        alias: 'doctrine.orm.entity_manager'
    app.test_messenger.transport.async:
        public: true
        alias: 'messenger.transport.async'
    app.test_messenger.transport.failed:
        public: true
        alias: 'messenger.transport.failed'

