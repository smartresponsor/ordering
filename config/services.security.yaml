services:
    App\Ordering\Service\Security\Order\OrderWebhookSignatureVerifier:
        arguments:
            $secret: '%env(WEBHOOK_SECRET)%'

    App\Ordering\EventSubscriber\OrderWebhookHmacSubscriber:
        arguments:
            $header: 'X-Signature'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.request' }
