static_resources:
    listeners:
        -   name: listener_0
            address: { socket_address: { address: 0.0.0.0, port_value: 8081 } }
            filter_chains:
                -   filters:
                        -   name: envoy.filters.network.http_connection_manager
                            typed_config:
                                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                                route_config:
                                    name: local_route
                                    virtual_hosts:
                                        -   name: backend
                                            domains: [ "*" ]
                                            routes:
                                                -   match: { prefix: "/" }
                                                    route: { cluster: backend }
                                http_filters:
                                    -   name: envoy.filters.http.jwt_authn
                                        typed_config:
                                            "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                                            providers:
                                                oidc:
                                                    issuer: "https://issuer.example"
                                                    remote_jwks:
                                                        http_uri:
                                                            uri: "https://issuer.example/.well-known/jwks.json"
                                                            cluster: jwks
                                                            timeout: 5s
                                                        cache_duration: 600s
                                                    forward: true
                                                    from_headers:
                                                        -   name: Authorization
                                                            value_prefix: "Bearer "
                                                    forward_payload_header: "x-jwt-payload"
                                            rules:
                                                -   match: { prefix: "/" }
                                                    requires:
                                                        provider_name: oidc
                                    -   name: envoy.filters.http.router
    clusters:
        -   name: backend
            connect_timeout: 1s
            type: logical_dns
            lb_policy: round_robin
            load_assignment:
                cluster_name: backend
                endpoints:
                    -   lb_endpoints:
                            -   endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 8080 } } }
        -   name: jwks
            connect_timeout: 1s
            type: logical_dns
            lb_policy: round_robin
            load_assignment:
                cluster_name: jwks
                endpoints:
                    -   lb_endpoints:
                            -   endpoint: { address: { socket_address: { address: issuer.example, port_value: 443 } } }
            transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
