services:
  App\Repository\Order\OutboxRepository:
    arguments: ['@doctrine.orm.entity_manager']

  App\Service\Order\TransactionalEventPublisher:
    arguments: ['@App\Repository\Order\OutboxRepository', '@messenger.bus.default']

  App\Service\Order\OutboxRelay:
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@App\Repository\Order\OutboxRepository'
      - '@App\Service\Order\TransactionalEventPublisher'
      - '@logger'

  App\MessageHandler\Order\OrderDomainMessageHandler:
    arguments: ['@logger']
    tags: ['messenger.message_handler']
