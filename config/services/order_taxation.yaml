services:
  App\Service\Order\Currency\InMemoryRateProvider:
    arguments:
      $pairs:
        'USD:EUR': 0.92
        'EUR:USD': 1.09
        'USD:GBP': 0.78
        'GBP:USD': 1.28
        'USD:UAH': 40.00
        'UAH:USD': 0.025
        'EUR:UAH': 43.50
        'UAH:EUR': 0.023
  App\Service\Order\Currency\CurrencyConversionService: ~

  # Calculator with default behaviour tax-after-discount=true
  App\Service\Order\OrderPricing\AdvancedPriceCalculator:
    arguments:
      $taxAfterDiscount: true
