    App\Ordering\Controller\OrderManagementController:
        public: true
        tags: ['controller.service_arguments']

    App\Ordering\Command\OrderDemoLoadCommand: ~
    App\Ordering\Command\OrderDemoResetCommand: ~
    App\Ordering\Command\OrderDiagnosticsCommand: ~
    App\Ordering\Command\OrderReportCommand: ~
