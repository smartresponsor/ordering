        autowire: true
        autoconfigure: true

    App\Ordering\Form\:
        resource: '../src/Form/'

    App\Ordering\Service\OrderManagementSurfaceContractFactory: ~
    App\Ordering\Service\Demo\OrderDemoDataService: ~

