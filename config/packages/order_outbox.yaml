parameters:
  order.outbox.max_attempts: 5

services:
  App\Service\Order\Outbox\ExponentialBackoffStrategy:
    autowire: true
    autoconfigure: true

  App\Service\Order\Outbox\DlqPublisher:
    arguments:
      $logger: '@monolog.logger.order.outbox'
    autowire: true
    autoconfigure: true

  App\Infrastructure\Order\Outbox\OutboxProcessor:
    arguments:
      $backoff: '@App\Service\Order\Outbox\ExponentialBackoffStrategy'
      $dlq: '@App\Service\Order\Outbox\DlqPublisher'
      $logger: '@monolog.logger.order.outbox'
      $maxAttempts: '%order.outbox.max_attempts%'
    autowire: true
    autoconfigure: true

  App\Infrastructure\Order\Outbox\Command\OutboxRunCommand:
    tags: ['console.command']
    autowire: true
    autoconfigure: true
