services:
  # ApiMetric bound to 'order.api' channel
  App\Service\Order\Observability\MonologApiMetric:
    arguments:
      - '@monolog.logger.order.api'
    autowire: true
    autoconfigure: true

  App\Infrastructure\Order\Observability\ApiMetricListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 90 }
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -90 }
