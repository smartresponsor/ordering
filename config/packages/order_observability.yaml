services:
  App\Service\Order\Observability\MonologTelemetry:
    arguments:
      - '@monolog.logger.order'
    autowire: true
    autoconfigure: true

  App\Infrastructure\Order\Observability\RequestCorrelationListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 100 }
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -100 }

  App\Infrastructure\Order\Observability\LogCorrelationProcessor:
    tags:
      - { name: monolog.processor }
