
services:
  App\\Service\\Order\\Http\\NdjsonAuditSink:
    arguments:
      $projectDir: '%kernel.project_dir%'
    autowire: true
    autoconfigure: true

  App\\Service\\Order\\Http\\AuditRotator:
    arguments:
      $projectDir: '%kernel.project_dir%'
    autowire: true
    autoconfigure: true

  App\\Service\\Order\\Http\\CompositeAuditLogger:
    autowire: true
    autoconfigure: true

  App\\ServiceInterface\\Order\\Http\\AuditLoggerInterface: '@App\\Service\\Order\\Http\\CompositeAuditLogger'
  App\\ServiceInterface\\Order\\Http\\AuditSinkInterface: '@App\\Service\\Order\\Http\\NdjsonAuditSink'
  App\\ServiceInterface\\Order\\Http\\AuditRotateInterface: '@App\\Service\\Order\\Http\\AuditRotator'
