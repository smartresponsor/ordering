
parameters:
  # optional defaults
  order.audit.s3.prefix: 'order/'
  order.audit.s3.sse: 'AES256'
  order.audit.s3.kms_key: ''

services:
  # S3 factory & client
  App\\Infrastructure\\Order\\Storage\\S3ClientFactory:
    arguments:
      $config:
        version: 'latest'
        region: '%env(string:AWS_REGION)%'
        # Optional S3-compatible storage (e.g., MinIO):
        endpoint: '%env(default::AWS_ENDPOINT)%'
        use_path_style_endpoint: '%env(bool:default::AWS_S3_PATH_STYLE)%'
        credentials:
          key: '%env(string:AWS_ACCESS_KEY_ID)%'
          secret: '%env(string:AWS_SECRET_ACCESS_KEY)%'
          token: '%env(default::AWS_SESSION_TOKEN)%'
    autowire: true
    autoconfigure: true

  Aws\\S3\\S3Client:
    factory: ['@App\\Infrastructure\\Order\\Storage\\S3ClientFactory', 'create']

  App\\Service\\Order\\Http\\S3AuditShipper:
    arguments:
      $s3: '@Aws\\S3\\S3Client'
      $projectDir: '%kernel.project_dir%'
      $defaultBucket: '%env(string:ORDER_AUDIT_S3_BUCKET)%'
      $prefix: '%env(default::ORDER_AUDIT_S3_PREFIX)%'
      $sse: '%env(default::ORDER_AUDIT_S3_SSE)%'
      $kmsKey: '%env(default::ORDER_AUDIT_S3_KMS_KEY)%'
    autowire: true
    autoconfigure: true

  App\\ServiceInterface\\Order\\Http\\AuditShipInterface: '@App\\Service\\Order\\Http\\S3AuditShipper'
