
parameters:
  order.audit.sample_ratio: 0.2
  order.audit.max_body_bytes: 2048
  order.audit.exclude_path: ['/_profiler','/metrics','/health','/ready']

services:
  App\Service\Order\Http\MonologAuditLogger:
    arguments:
      - '@monolog.logger.order.audit'
    autowire: true
    autoconfigure: true

  App\Service\Order\Http\Redactor:
    autowire: true
    autoconfigure: true

  App\Infrastructure\Order\Http\AuditListener:
    arguments:
      $sampleRatio: '%order.audit.sample_ratio%'
      $maxBodyBytes: '%order.audit.max_body_bytes%'
      $excludePath: '%order.audit.exclude_path%'
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 80 }
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -80 }
    autowire: true
    autoconfigure: true
