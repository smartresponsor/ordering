framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: 'in-memory://'
                retry_strategy:
                    max_retries: 0
            failed:
                dsn: 'in-memory://'
        routing:
            'App\Message\Outbox\OrderOutboxDispatchedMessage': async
            'App\Message\OrderEventMessage': async
