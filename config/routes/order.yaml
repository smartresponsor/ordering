order_health:
  path: /api/order/health
  controller: App\Controller\OrderController::health
  methods: [GET]

order_get:
  path: /api/order/{id}
  controller: App\Controller\OrderController::getById
  methods: [GET]

order_create:
  path: /api/order/create
  controller: App\Controller\OrderController::create
  methods: [POST]
