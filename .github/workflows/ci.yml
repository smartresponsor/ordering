name: CI
on: { push: { branches: [ main ] }, pull_request: { branches: [ main ] } }
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports: [ "5672:5672", "15672:15672" ]
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
    strategy: { matrix: { php: [ "8.2", "8.3" ] } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, amqp
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit -v
        env:
          APP_ENV: test
          MESSENGER_TRANSPORT_DSN: amqp://guest:guest@localhost:5672/%2f/messages
          MESSENGER_FAILURE_TRANSPORT_DSN: amqp://guest:guest@localhost:5672/%2f/messages.dlx
