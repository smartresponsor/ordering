name: Order Component CI/CD + Helm Deploy (Staging & Production)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (PHP 8.2 / 8.3 /8.4)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    services:
      postgres:
        image: postgres:15
        ports: [ 5432:5432 ]
        env:
          POSTGRES_USER: symfony
          POSTGRES_PASSWORD: symfony
          POSTGRES_DB: order_test
        options: >-
          --health-cmd="pg_isready -U symfony -d order_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: pdo_pgsql, intl, gd, mbstring
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Doctrine Migration
        run: php bin/console doctrine:migrations:migrate --no-interaction
      - name: Run Tests
        run: vendor/bin/phpunit --testdox --colors=always
      - name: Static Analysis (PHPStan + Psalm)
        run: |
          vendor/bin/phpstan analyse --no-progress --level=max src
          vendor/bin/psalm --output-format=compact
      - name: Rector Dry-Run
        run: vendor/bin/rector process src --dry-run

  release:
    name: Release & Publish
    needs: build-test
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag Release
        run: |
          VERSION=v$(date +'%Y.%m.%d')
          git tag -a "$VERSION" -m "Automated release $VERSION"
          git push origin "$VERSION"
      - name: Publish to Packagist
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer publish
      - name: Update GitHub Milestone
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const phase = 'α → β → γ';
            core.notice(`Milestone phase progression: ${phase}`);

  deploy-staging:
    name: Deploy to Kubernetes (Staging)
    needs: release
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/order:${{ github.sha }} .
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}/order:${{ github.sha }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3
      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3
      - name: Helm deploy to staging
        run: |
          helm upgrade --install order ./charts/ordercomponent --namespace order-staging --create-namespace --values ./charts/ordercomponent/values-staging.yaml --set app.phpImage=ghcr.io/${{ github.repository }}/order:${{ github.sha }} --set worker.image=ghcr.io/${{ github.repository }}/order:${{ github.sha }} --wait
      - name: Verify rollout
        run: kubectl rollout status deployment/order -n order-staging

  deploy-production:
    name: Deploy to Kubernetes (Production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3
      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3
      - name: Helm deploy to production
        run: |
          helm upgrade --install order ./charts/ordercomponent --namespace order-prod --create-namespace --values ./charts/ordercomponent/values-production.yaml --set app.phpImage=ghcr.io/${{ github.repository }}/order:${{ github.sha }} --set worker.image=ghcr.io/${{ github.repository }}/order:${{ github.sha }} --history-max=10 --wait
      - name: Verify rollout
        run: kubectl rollout status deployment/order -n order-prod
      - name: Rollback on failure
        if: failure()
        run: helm rollback order --namespace order-prod
      - name: Tag production release
        run: |
          VERSION=v1.$(date +'%m%d')
          git tag -a "$VERSION" -m "Production release $VERSION"
          git push origin "$VERSION"
