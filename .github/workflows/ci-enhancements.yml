name: OrderComponent CI/CD

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: xdebug
      - name: Cache composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate
        run: composer validate --no-check-publish
      - name: Static analysis
        run: |
          if [ -f vendor/bin/phpstan ]; then vendor/bin/phpstan analyse --memory-limit=1G || true; fi
          if [ -f vendor/bin/psalm ]; then vendor/bin/psalm --no-cache || true; fi
          if [ -f vendor/bin/rector ]; then vendor/bin/rector process --dry-run || true; fi
      - name: Tests
        run: |
          if [ -f vendor/bin/phpunit ]; then vendor/bin/phpunit --testdox; fi
      - name: Pack artifact
        run: zip -r OrderComponent-build.zip . -x "vendor/*"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OrderComponent-build-${{ matrix.php }}
          path: OrderComponent-build.zip
