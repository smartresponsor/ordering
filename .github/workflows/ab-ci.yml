name: AB CI
on:
  push:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'test/**'
  pull_request:
    branches: [ "order-rc-2-stab", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: Test
        run: composer test || true
