name: chaos-nightly
on: { schedule: [ { cron: "15 2 * * *" } ], workflow_dispatch: { } }
jobs:
    matrix:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                scenario: [ "deploy/chaos/scenario/db-outage.json", "deploy/chaos/scenario/netem-db.yaml" ]
        steps:
            -   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            -   name: Preflight
                run:
                    echo "Note: netem requires privileged runner"
            -   name: Run scenario
                run: |
                    if [[ "${{ matrix.scenario }}" == *.yaml ]]; then echo "(YAML runner not implemented, use json twin)"; else php bin/run-scenario.php "${{ matrix.scenario }}"; fi
